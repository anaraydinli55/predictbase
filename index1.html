        :root { --green: #00e87a; --bg: #05070a; --border: rgba(255,255,255,0.08); }
        body { background: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; color: white; margin: 0; padding-bottom: 80px; }
        .font-display { font-family: 'Barlow Condensed', sans-serif; }
        .card { background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%); border: 1px solid var(--border); border-radius: 20px; }
        .neon-g { color: var(--green); text-shadow: 0 0 15px rgba(0,232,122,0.3); }
        .btn-primary { background: linear-gradient(135deg, #00e87a 0%, #00b85e 100%); color: #03100a; font-weight: 800; border-radius: 12px; cursor: pointer; border: none; }
        .score-box { width: 60px; height: 60px; border-radius: 12px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); color: white; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-size: 1.8rem; font-weight: 800; outline: none; }
        .score-box:focus { border-color: var(--green); }
        .type-label { font-size: 8px; color: var(--green); font-weight: 800; text-transform: uppercase; margin-top: 4px; }
        .team-orb { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
        .header-wrap { position: sticky; top: 0; z-index: 50; background: rgba(5,7,10,0.96); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
        .search-bar { background: rgba(255,255,255,0.06); border: 1px solid var(--border); padding: 12px 16px; border-radius: 14px; width: 100%; color: white; outline: none; }
        .modal-bg { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); align-items: flex-end; justify-content: center; }
        .modal-bg.open { display: flex; }
        .modal-sheet { width: 100%; max-width: 480px; background: #0c1016; border-radius: 28px 28px 0 0; padding: 25px; animation: rise 0.3s ease-out; }
        @keyframes rise { from{transform:translateY(100%)} to{transform:translateY(0)} }
    </style>
</head>

function render(filter = "") {
    const list = document.getElementById('match-list');
    const filtered = MATCHES.filter(m => 
        m.home.n.toLowerCase().includes(filter.toLowerCase()) || 
        m.away.n.toLowerCase().includes(filter.toLowerCase()) ||
        m.stage.toLowerCase().includes(filter.toLowerCase())
    );

    list.innerHTML = filtered.map(m => `
        <div class="card p-4 flex flex-col gap-3">
            <div class="flex justify-between items-start text-[8px] font-bold text-gray-500 uppercase tracking-widest">
                <div>${m.stage} • ${m.stadium}</div>
                <div class="text-green-500">${m.date} • ${m.time}</div>
            </div>
            <div class="flex items-center justify-between">
                <div class="flex flex-col items-center w-[40%] gap-1">
                    <div class="team-orb">${m.home.f}</div>
                    <div class="font-display text-[11px] font-black uppercase text-center leading-tight">${m.home.n}</div>
                </div>
                <div class="font-display text-xl font-black text-gray-800">VS</div>
                <div class="flex flex-col items-center w-[40%] gap-1">
                    <div class="team-orb">${m.away.f}</div>
                    <div class="font-display text-[11px] font-black uppercase text-center leading-tight">${m.away.n}</div>
                </div>
            </div>
            <div class="flex justify-between items-center border-t border-white/5 pt-3">
                <div class="text-[8px] font-bold text-gray-600 uppercase">Pool: 0 USDC</div>
                <button onclick="window.openModal(${m.id})" class="btn-primary px-6 py-2 text-[10px] uppercase">Predict</button>
            </div>
        </div>
    `).join('');
}

window.openModal = (id) => {
    const m = MATCHES.find(x => x.id === id);
    document.getElementById('modal-title').innerText = `${m.home.c} VS ${m.away.c}`;
    document.getElementById('m-home-flag').innerText = m.home.f;
    document.getElementById('m-away-flag').innerText = m.away.f;
    document.getElementById('m-home-code').innerText = m.home.c;
    document.getElementById('m-away-code').innerText = m.away.c;
    document.getElementById('s-home').value = 0;
    document.getElementById('s-away').value = 0;
    document.getElementById('predict-modal').classList.add('open');
};

document.getElementById('modal-close').onclick = () => document.getElementById('predict-modal').classList.remove('open');
document.getElementById('match-search').oninput = (e) => render(e.target.value);

render();
</script>
